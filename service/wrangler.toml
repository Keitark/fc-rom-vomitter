name = "fc-rom-vomitter-expo-staging"
main = "src/index.ts"
compatibility_date = "2026-09-22"
workers_dev = true
preview_urls = false

[vars]
DEVICE_ID = "demo-cart-01"
JOB_TTL_SECONDS = "3600"
LEASE_SECONDS = "60"
MAX_QUEUE = "20"
UPLOAD_COOLDOWN_SECONDS = "10"

[[d1_databases]]
binding = "DB"
database_name = "fc-rom-vomitter-expo-staging"
database_id = "96dcd077-f92d-46f0-b734-421419ea1ff9"

[[r2_buckets]]
binding = "ROMS"
bucket_name = "fc-rom-vomitter-expo-staging-roms"

# DEVICE_HMAC_SECRET, OPERATOR_TOKEN and RATE_LIMIT_SALT are secrets.
# For local use, put them in an ignored .dev.vars file. For staging, use
# `wrangler secret put NAME`; never add their values here.
